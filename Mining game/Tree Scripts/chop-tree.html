<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Chop Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      background: transparent;
      font-family: 'Chakra Petch', sans-serif;
      color: #e0dcd0;
      user-select: none; -webkit-user-select: none;
    }

    .mine-panel {
      width: 360px; margin: 20px auto;
      background: linear-gradient(160deg, rgba(42,37,32,0.97) 0%, rgba(26,24,21,0.99) 100%);
      border: 2px solid #5a4a35;
      border-radius: 4px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      padding: 18px;
      animation: slideUp 0.3s ease;
      position: relative;
    }
    .mine-panel::before {
      content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
      background: #8B6914;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Shake */
    .shake { animation: shakeIt 0.1s ease; }
    @keyframes shakeIt {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 1px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-1px, 2px); }
      100% { transform: translate(0, 0); }
    }

    /* ========== HEADER ========== */
    .mine-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .mine-title-area { display: flex; align-items: center; gap: 8px; }
    .mine-title {
      font-size: 16px; font-weight: 700; color: #8B6914;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .mine-sub { font-size: 10px; color: #666; letter-spacing: 1px; }

    .click-counter {
      display: flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 2px;
      border: 1px solid #3a3025;
    }
    .click-count {
      font-size: 16px; font-weight: 700; color: #c8a04a;
      letter-spacing: 1px;
    }
    .click-label { font-size: 8px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

    /* ========== ROCK AREA ========== */
    .rock-zone {
      position: relative;
      height: 160px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      cursor: pointer;
      border: 1px solid #2a2520;
      border-radius: 3px;
      background: radial-gradient(ellipse at center, rgba(40,35,28,0.6) 0%, rgba(20,18,14,0.3) 70%);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .rock-zone:active { cursor: crosshair; }

    /* Rock SVG */
    .rock-container { position: relative; transition: transform 0.05s; }
    .rock-svg { width: 100px; height: 90px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }

    /* Crack overlay */
    .crack-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }

    /* Click sparks */
    .click-spark {
      position: absolute; pointer-events: none;
      width: 6px; height: 6px;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      opacity: 0;
    }
    .click-spark.fly { animation: sparkBurst 0.4s ease-out forwards; }
    @keyframes sparkBurst {
      0% { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(180deg); }
    }

    /* Click damage number */
    .dmg-number {
      position: absolute; pointer-events: none;
      font-size: 16px; font-weight: 700; color: #c8a04a;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      opacity: 0; letter-spacing: 1px;
    }
    .dmg-number.pop { animation: dmgPop 0.7s ease-out forwards; }
    @keyframes dmgPop {
      0% { opacity: 1; transform: translateY(0) scale(1.2); }
      60% { opacity: 1; transform: translateY(-30px) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
    }

    /* Pickaxe hit indicator */
    .pick-hit {
      position: absolute; font-size: 30px; pointer-events: none; opacity: 0;
      transform-origin: bottom right;
    }
    .pick-hit.swing { animation: pickHit 0.25s ease-out forwards; }
    @keyframes pickHit {
      0% { opacity: 1; transform: rotate(15deg) scale(1.1); }
      40% { opacity: 1; transform: rotate(-40deg) scale(1); }
      100% { opacity: 0; transform: rotate(-40deg) scale(0.8); }
    }

    /* ========== INTRO OVERLAY ========== */
    .intro-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, rgba(42,37,32,0.99) 0%, rgba(26,24,21,0.99) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 50;
      animation: introFade 0.6s ease 1.2s forwards;
    }
    @keyframes introFade {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
    .intro-pick {
      font-size: 48px; margin-bottom: 10px;
      animation: introPick 0.4s ease-in-out 3;
    }
    @keyframes introPick {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-30deg); }
    }
    .intro-text {
      font-size: 14px; font-weight: 700; color: #c8a04a;
      letter-spacing: 3px; text-transform: uppercase;
      animation: introTextPulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes introTextPulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Tap hint */
    .tap-hint {
      position: absolute; bottom: 8px; left: 0; right: 0;
      text-align: center; font-size: 10px; color: #555;
      letter-spacing: 2px; text-transform: uppercase;
      animation: pulseHint 1.5s ease-in-out infinite;
    }
    @keyframes pulseHint {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* ========== PROGRESS BAR ========== */
    .bar-outer {
      background: #151210; border: 1px solid #3a3025; border-radius: 2px;
      height: 24px; position: relative; overflow: hidden;
      margin-bottom: 6px;
    }
    .bar-fill {
      height: 100%; width: 0%; border-radius: 1px;
      background: linear-gradient(180deg, #8B6914 0%, #5a4410 100%);
      transition: width 0.15s ease-out;
      position: relative;
    }
    .bar-fill::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 40%;
      background: rgba(255,255,255,0.08);
    }
    .bar-text {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
      z-index: 2; pointer-events: none;
    }

    /* ========== COMBO ========== */
    .combo-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
    }
    .combo-text { font-size: 10px; color: #666; letter-spacing: 1px; }
    .combo-value { font-size: 12px; font-weight: 700; color: #c8a04a; letter-spacing: 1px; }
    .combo-value.hot { color: #e85030; }
    .combo-value.fire { color: #ff4020; text-shadow: 0 0 8px rgba(255,64,32,0.5); }

    /* ========== COMPLETE ========== */
    .complete-panel {
      text-align: center; display: none;
      animation: completeIn 0.4s ease;
    }
    @keyframes completeIn {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .complete-icon { font-size: 44px; margin-bottom: 8px; }
    .complete-text {
      font-size: 18px; font-weight: 700; color: #8B6914;
      letter-spacing: 2px;
    }
    .complete-sub {
      font-size: 10px; color: #666; letter-spacing: 1px; margin-top: 4px;
    }
    .complete-stats {
      display: flex; justify-content: center; gap: 20px; margin-top: 12px;
    }
    .complete-stat { text-align: center; }
    .complete-stat-val { font-size: 16px; font-weight: 700; color: #c8a04a; }
    .complete-stat-lbl { font-size: 8px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="mine-panel" id="minePanel">

    <!-- INTRO OVERLAY - covers reset -->
    <div class="intro-overlay" id="introOverlay">
      <div class="intro-pick">&#9935;</div>
      <div class="intro-text">Preparing Rock...</div>
    </div>

    <!-- MINING STATE -->
    <div id="miningState">
      <!-- Header -->
      <div class="mine-header">
        <div>
          <div class="mine-title-area">
            <span style="font-size:20px;">&#9935;</span>
            <span class="mine-title">Wood</span>
          </div>
          <div class="mine-sub">Click the rock to mine!</div>
        </div>
        <div class="click-counter">
          <div>
            <div class="click-count" id="clickCount">0</div>
            <div class="click-label">Clicks</div>
          </div>
        </div>
      </div>

      <!-- Rock click area -->
      <div class="rock-zone" id="rockZone">
        <div class="rock-container" id="rockContainer">
          <!-- Low poly rock SVG -->
          <svg class="rock-svg" id="rockSvg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
            <!-- Tree trunk body -->
            <rect x="25" y="5" width="50" height="80" rx="6" ry="6" fill="#8B6914" stroke="#6B4F10" stroke-width="1"/>
            <!-- Light side -->
            <rect x="25" y="5" width="25" height="80" rx="6" ry="0" fill="#9B7924" stroke="none" opacity="0.4"/>
            <!-- Dark side -->
            <rect x="50" y="5" width="25" height="80" rx="0" ry="6" fill="#6B4F10" stroke="none" opacity="0.3"/>
            <!-- Top ring -->
            <ellipse cx="50" cy="8" rx="25" ry="5" fill="#A08020" stroke="#6B4F10" stroke-width="0.5"/>
            <!-- Wood grain -->
            <path d="M28,25 Q50,22 72,25" fill="none" stroke="#6B4F10" stroke-width="1.5" opacity="0.6"/>
            <path d="M28,40 Q50,37 72,40" fill="none" stroke="#6B4F10" stroke-width="1.5" opacity="0.5"/>
            <path d="M28,55 Q50,52 72,55" fill="none" stroke="#6B4F10" stroke-width="1.5" opacity="0.6"/>
            <path d="M28,70 Q50,67 72,70" fill="none" stroke="#6B4F10" stroke-width="1.5" opacity="0.5"/>
            <!-- Wood knots -->
            <circle cx="40" cy="32" r="3" fill="#5a4410" opacity="0.7"/>
            <circle cx="58" cy="48" r="2.5" fill="#5a4410" opacity="0.6"/>
            <circle cx="42" cy="62" r="2" fill="#5a4410" opacity="0.7"/>
          </svg>

          <!-- Crack overlays that appear as you mine -->
          <svg class="crack-overlay" id="crack1" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
            <line x1="45" y1="20" x2="50" y2="45" stroke="#1a1510" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="50" y1="45" x2="42" y2="55" stroke="#1a1510" stroke-width="1" stroke-linecap="round"/>
          </svg>
          <svg class="crack-overlay" id="crack2" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
            <line x1="65" y1="25" x2="58" y2="50" stroke="#1a1510" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="58" y1="50" x2="65" y2="65" stroke="#1a1510" stroke-width="1" stroke-linecap="round"/>
            <line x1="50" y1="45" x2="55" y2="38" stroke="#1a1510" stroke-width="1" stroke-linecap="round"/>
          </svg>
          <svg class="crack-overlay" id="crack3" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
            <line x1="30" y1="35" x2="50" y2="50" stroke="#1a1510" stroke-width="2" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="70" y2="45" stroke="#1a1510" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="50" y1="50" x2="48" y2="70" stroke="#1a1510" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="40" y1="25" x2="35" y2="40" stroke="#1a1510" stroke-width="1" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="tap-hint" id="tapHint">&#9650; CLICK TO MINE &#9650;</div>
      </div>

      <!-- Combo -->
      <div class="combo-bar">
        <span class="combo-text">COMBO</span>
        <span class="combo-value" id="comboText">x1</span>
      </div>

      <!-- Progress bar -->
      <div class="bar-outer">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-text" id="barText">0%</div>
      </div>
    </div>

    <!-- COMPLETE STATE -->
    <div class="complete-panel" id="completeState">
      <div class="complete-icon">&#9935;&#128142;</div>
      <div class="complete-text">+1 Wood!</div>
      <div class="complete-sub">Added to inventory</div>
      <div class="complete-stats">
        <div class="complete-stat">
          <div class="complete-stat-val" id="finalClicks">0</div>
          <div class="complete-stat-lbl">Clicks</div>
        </div>
        <div class="complete-stat">
          <div class="complete-stat-val" id="finalTime">0s</div>
          <div class="complete-stat-lbl">Time</div>
        </div>
        <div class="complete-stat">
          <div class="complete-stat-val" id="finalCombo">x1</div>
          <div class="complete-stat-lbl">Best Combo</div>
        </div>
      </div>
    </div>

  </div>

  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js"></script>

        // Decode base64 to ArrayBuffer
        var raw = atob(AUDIO_B64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) {
          arr[i] = raw.charCodeAt(i);
        }

        audioCtx.decodeAudioData(arr.buffer, function(buffer) {
          audioBuffer = buffer;
          audioReady = true;
          console.log('[Mine] Audio ready (embedded base64)');
        }, function(err) {
          console.log('[Mine] Audio decode error:', err);
        });
      } catch(e) {
        console.log('[Mine] Audio init error:', e);
      }
    }

    function playHitSound() {
      if (!audioReady || !audioBuffer || !audioCtx) return;
      try {
        // Resume context if suspended (autoplay policy)
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        var source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;

        // Random pitch variance: 0.5 (deep) to 1.8 (high) - wide spread for variety
        var pitches = [0.5, 0.65, 0.8, 0.9, 1.0, 1.1, 1.2, 1.4, 1.6, 1.8];
        source.playbackRate.value = pitches[Math.floor(Math.random() * pitches.length)];

        // Random volume: 0.4 to 0.8
        var gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.4 + Math.random() * 0.4;

        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
      } catch(e) {
        console.log('[Mine] Audio play error:', e);
      }
    }

    // Init audio on load
    initAudio();

    // ========================================
    // ELEMENTS
    // ========================================
    var minePanel = document.getElementById('minePanel');
    var rockZone = document.getElementById('rockZone');
    var rockContainer = document.getElementById('rockContainer');
    var barFill = document.getElementById('barFill');
    var barText = document.getElementById('barText');
    var clickCount = document.getElementById('clickCount');
    var comboText = document.getElementById('comboText');
    var tapHint = document.getElementById('tapHint');
    var miningState = document.getElementById('miningState');
    var completeState = document.getElementById('completeState');
    var crack1 = document.getElementById('crack1');
    var crack2 = document.getElementById('crack2');
    var crack3 = document.getElementById('crack3');

    // ========================================
    // CLICK HANDLER
    // ========================================
    rockZone.addEventListener('click', function(e) {
      if (done) return;

      clicks++;
      var now = Date.now();

      // Combo system
      if (now - lastClickTime < COMBO_WINDOW) {
        combo++;
      } else {
        combo = 1;
      }
      lastClickTime = now;
      if (combo > bestCombo) bestCombo = combo;

      // Update UI
      clickCount.textContent = clicks;
      updateCombo();
      updateBar();
      updateCracks();

      // Hide hint after first click
      if (clicks === 1) tapHint.style.display = 'none';

      // Play hit sound with random pitch
      playHitSound();

      // Visual feedback
      doShake();
      spawnSparks(e);
      spawnDmgNumber(e);
      spawnPickHit(e);
      rockBounce();

      // Check complete
      if (clicks >= TOTAL_CLICKS) {
        completeMining();
      }
    });

    // Prevent double-tap zoom on mobile
    rockZone.addEventListener('touchend', function(e) {
      e.preventDefault();
      // Create synthetic click at touch position
      var touch = e.changedTouches[0];
      var clickEvt = new MouseEvent('click', {
        clientX: touch.clientX,
        clientY: touch.clientY,
        bubbles: true
      });
      rockZone.dispatchEvent(clickEvt);
    });

    // ========================================
    // PROGRESS BAR
    // ========================================
    function updateBar() {
      var pct = Math.min(Math.floor((clicks / TOTAL_CLICKS) * 100), 100);
      barFill.style.width = pct + '%';
      barText.textContent = pct + '%';
    }

    // ========================================
    // COMBO
    // ========================================
    function updateCombo() {
      comboText.textContent = 'x' + combo;
      comboText.className = 'combo-value';
      if (combo >= 8) {
        comboText.classList.add('fire');
      } else if (combo >= 4) {
        comboText.classList.add('hot');
      }
    }

    // Decay combo if no clicks
    setInterval(function() {
      if (done) return;
      if (Date.now() - lastClickTime > COMBO_WINDOW && combo > 0) {
        combo = 0;
        comboText.textContent = 'x1';
        comboText.className = 'combo-value';
      }
    }, 200);

    // ========================================
    // CRACKS
    // ========================================
    function updateCracks() {
      var pct = clicks / TOTAL_CLICKS;
      if (pct >= 0.25) crack1.style.opacity = Math.min((pct - 0.25) * 4, 1);
      if (pct >= 0.50) crack2.style.opacity = Math.min((pct - 0.50) * 4, 1);
      if (pct >= 0.75) crack3.style.opacity = Math.min((pct - 0.75) * 4, 1);
    }

    // ========================================
    // VISUAL EFFECTS
    // ========================================
    function doShake() {
      minePanel.classList.remove('shake');
      void minePanel.offsetWidth;
      minePanel.classList.add('shake');
    }

    function rockBounce() {
      rockContainer.style.transform = 'scale(0.92)';
      setTimeout(function() { rockContainer.style.transform = 'scale(1)'; }, 80);
    }

    function spawnSparks(e) {
      var rect = rockZone.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      for (var i = 0; i < 5; i++) {
        var spark = document.createElement('div');
        spark.className = 'click-spark';
        spark.style.left = x + 'px';
        spark.style.top = y + 'px';
        var angle = (Math.random() * 360) * (Math.PI / 180);
        var dist = 20 + Math.random() * 30;
        spark.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        spark.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        spark.style.background = ORE_COLOR;
        spark.style.boxShadow = '0 0 4px ' + ORE_COLOR;
        rockZone.appendChild(spark);
        (function(s) { requestAnimationFrame(function() { s.classList.add('fly'); }); })(spark);
        (function(s) { setTimeout(function() { s.remove(); }, 500); })(spark);
      }
    }

    function spawnDmgNumber(e) {
      var rect = rockZone.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      var dmg = document.createElement('div');
      dmg.className = 'dmg-number';
      dmg.style.left = (x + (Math.random() * 20 - 10)) + 'px';
      dmg.style.top = (y - 10) + 'px';

      if (combo >= 8) {
        dmg.textContent = '+' + combo + '!';
        dmg.style.color = '#ff4020';
        dmg.style.fontSize = '20px';
      } else if (combo >= 4) {
        dmg.textContent = '+' + combo;
        dmg.style.color = '#e85030';
        dmg.style.fontSize = '18px';
      } else {
        dmg.textContent = '+1';
      }

      rockZone.appendChild(dmg);
      requestAnimationFrame(function() { dmg.classList.add('pop'); });
      setTimeout(function() { dmg.remove(); }, 800);
    }

    function spawnPickHit(e) {
      var rect = rockZone.getBoundingClientRect();
      var x = e.clientX - rect.left;
      var y = e.clientY - rect.top;

      var pick = document.createElement('div');
      pick.className = 'pick-hit';
      pick.textContent = '\u26CF';
      pick.style.left = (x - 20) + 'px';
      pick.style.top = (y - 25) + 'px';
      rockZone.appendChild(pick);
      requestAnimationFrame(function() { pick.classList.add('swing'); });
      setTimeout(function() { pick.remove(); }, 300);
    }

    // ========================================
    // COMPLETE
    // ========================================
    function completeMining() {
      done = true;
      var elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

      miningState.style.display = 'none';
      completeState.style.display = 'block';

      document.getElementById('finalClicks').textContent = clicks;
      document.getElementById('finalTime').textContent = elapsed + 's';
      document.getElementById('finalCombo').textContent = 'x' + bestCombo;

      // Tell Portals - mining complete
      triggerTask(TASK_NAME);
      triggerTask('AddWood');
      console.log('[Mine] Sent Tree_Chop_done');

      // Close iframe after 2 seconds
      setTimeout(function() {
        closeIframe();
      }, 2000);

      // Trigger rock respawn after 12 seconds (10s cooldown + 2s completion)
      setTimeout(function() {
        triggerTask('Tree_Chop_Respawn');
        console.log('[Mine] Sent Tree_Chop_Respawn');
      }, 12000);
    }

    // ========================================
    // PORTALS SDK
    // ========================================
    function triggerTask(taskName) {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.sendMessageToUnity) {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: taskName,
          TaskTargetState: 'SetNotActiveToActive'
        }));
        console.log('[Mine] Sent:', taskName);
      }
    }

    function closeIframe() {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.closeIframe) {
        PortalsSdk.closeIframe();
        console.log('[Mine] Closed iframe');
      }
    }

    // ========================================
    // RESET (for iframe reuse)
    // ========================================
    function resetGame() {
      clicks = 0;
      done = false;
      combo = 0;
      bestCombo = 0;
      lastClickTime = 0;
      startTime = Date.now();

      clickCount.textContent = '0';
      comboText.textContent = 'x1';
      comboText.className = 'combo-value';
      barFill.style.width = '0%';
      barText.textContent = '0%';
      crack1.style.opacity = 0;
      crack2.style.opacity = 0;
      crack3.style.opacity = 0;
      tapHint.style.display = '';

      miningState.style.display = 'block';
      completeState.style.display = 'none';

      // Audio context persists across resets - no need to reinit

      console.log('[Mine] Game reset');
    }

    // ========================================
    // AUTO-RESET: Polls every 500ms
    // When done for 3+ seconds, show intro and reset
    // Works for unlimited game loops
    // ========================================
    var doneTime = 0;
    var resetState = 0; // 0=idle, 1=waiting, 2=resetting

    setInterval(function() {
      // State 0: Watch for completion
      if (done && resetState === 0) {
        doneTime = Date.now();
        resetState = 1;
        console.log('[Mine] Completion detected, waiting 3s to reset');
      }

      // State 1: Wait 3 seconds then trigger reset
      if (resetState === 1 && Date.now() - doneTime > 3000) {
        resetState = 2;
        console.log('[Mine] Starting auto-reset');

        // Show intro overlay
        var overlay = document.getElementById('introOverlay');
        if (overlay) {
          overlay.style.display = '';
          overlay.style.opacity = '1';
          overlay.style.animation = 'none';
        }

        // Reset game state behind overlay
        resetGame();

        // Fade out overlay after 1.2s
        setTimeout(function() {
          var ov = document.getElementById('introOverlay');
          if (ov) ov.style.animation = 'introFade 0.6s ease forwards';
          setTimeout(function() {
            var ov2 = document.getElementById('introOverlay');
            if (ov2) ov2.style.display = 'none';
            // Back to idle - ready for next game loop
            resetState = 0;
            doneTime = 0;
            console.log('[Mine] Reset complete, ready for next round');
          }, 700);
        }, 1200);
      }
    }, 500);

    // ========================================
    // INIT
    // ========================================
    // Remove intro overlay after first load animation
    var introOverlay = document.getElementById('introOverlay');
    setTimeout(function() {
      if (introOverlay) introOverlay.style.display = 'none';
    }, 1900);

    console.log('[Mine] Tree - click ' + TOTAL_CLICKS + ' times to mine.');
  </script>
</body>
