<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .hud {
    position: fixed;
    bottom: 12px;
    left: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(30, 20, 12, 0.88);
    border: 2px solid #8b6914;
    border-radius: 8px;
    padding: 8px 14px 8px 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.6), inset 0 0 20px rgba(139,105,20,0.08);
  }

  .ore-grid {
    display: flex;
    gap: 6px;
  }

  .ore-slot {
    width: 52px;
    height: 56px;
    background: rgba(50, 35, 18, 0.9);
    border: 2px solid #6b5220;
    border-radius: 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color 0.2s;
  }
  .ore-slot:hover {
    border-color: #c9a227;
  }

  .ore-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    margin-bottom: 2px;
  }

  .ore-icon.copper {
    background: linear-gradient(135deg, #b87333, #da8a67);
    color: #3e1f00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  .ore-icon.iron {
    background: linear-gradient(135deg, #8a8a8a, #b0b0b0);
    color: #2a2a2a;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  .ore-icon.gold {
    background: linear-gradient(135deg, #c9a227, #f0d060);
    color: #5a3e00;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }
  .ore-icon.diamond {
    background: linear-gradient(135deg, #4fc3f7, #b3e5fc);
    color: #0d47a1;
    text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  }

  .ore-count {
    font-size: 11px;
    color: #d4c5a0;
    font-weight: 600;
  }
  .ore-count.has-ore {
    color: #f0d060;
  }

  .divider {
    width: 1px;
    height: 40px;
    background: #6b5220;
    margin: 0 4px;
  }

  .stats {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 70px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .coin-icon {
    width: 18px;
    height: 18px;
    background: radial-gradient(circle at 40% 35%, #f0d060, #c9a227);
    border-radius: 50%;
    border: 1.5px solid #8b6914;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 800;
    color: #5a3e00;
  }

  .coin-value {
    font-size: 15px;
    font-weight: 700;
    color: #f0d060;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .pick-icon {
    font-size: 14px;
  }

  .pick-name {
    font-size: 11px;
    font-weight: 600;
    color: #d4c5a0;
  }
  .pick-name.tier1 { color: #a0836d; }
  .pick-name.tier2 { color: #b0b0b0; }
  .pick-name.tier3 { color: #f0d060; }
  .pick-name.tier4 { color: #4fc3f7; }
</style>
</head>
<body>

<div class="hud">
  <div class="ore-grid">
    <div class="ore-slot" title="Copper Ore">
      <div class="ore-icon copper">Cu</div>
      <div class="ore-count" id="copper-count">x0</div>
    </div>
    <div class="ore-slot" title="Iron Ore">
      <div class="ore-icon iron">Fe</div>
      <div class="ore-count" id="iron-count">x0</div>
    </div>
    <div class="ore-slot" title="Gold Ore">
      <div class="ore-icon gold">Au</div>
      <div class="ore-count" id="gold-count">x0</div>
    </div>
    <div class="ore-slot" title="Diamond">
      <div class="ore-icon diamond">Dm</div>
      <div class="ore-count" id="diamond-count">x0</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="stats">
    <div class="stat-row">
      <div class="coin-icon">$</div>
      <div class="coin-value" id="coin-value">0</div>
    </div>
    <div class="stat-row">
      <span class="pick-icon">&#9935;</span>
      <span class="pick-name tier1" id="pick-name">Wood</span>
    </div>
  </div>
</div>

<script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
<script>
(function() {
  // State
  let copper = 0, iron = 0, gold = 0, diamond = 0, coins = 0, tier = 1;

  const PICK_NAMES = { 1: 'Wood', 2: 'Iron', 3: 'Gold', 4: 'Diamond' };
  const PICK_CLASSES = { 1: 'tier1', 2: 'tier2', 3: 'tier3', 4: 'tier4' };

  // DOM refs
  const elCopper = document.getElementById('copper-count');
  const elIron = document.getElementById('iron-count');
  const elGold = document.getElementById('gold-count');
  const elDiamond = document.getElementById('diamond-count');
  const elCoins = document.getElementById('coin-value');
  const elPick = document.getElementById('pick-name');

  function render() {
    elCopper.textContent = 'x' + copper;
    elCopper.className = 'ore-count' + (copper > 0 ? ' has-ore' : '');

    elIron.textContent = 'x' + iron;
    elIron.className = 'ore-count' + (iron > 0 ? ' has-ore' : '');

    elGold.textContent = 'x' + gold;
    elGold.className = 'ore-count' + (gold > 0 ? ' has-ore' : '');

    elDiamond.textContent = 'x' + diamond;
    elDiamond.className = 'ore-count' + (diamond > 0 ? ' has-ore' : '');

    elCoins.textContent = coins;

    elPick.textContent = PICK_NAMES[tier] || 'Wood';
    elPick.className = 'pick-name ' + (PICK_CLASSES[tier] || 'tier1');
  }

  // Parse inv_ messages: inv_C_I_G_D_COINS_TIER
  function handleMessage(msg) {
    if (typeof msg !== 'string') return;

    if (msg.startsWith('inv_')) {
      var parts = msg.substring(4).split('_');
      if (parts.length >= 6) {
        copper = parseInt(parts[0]) || 0;
        iron = parseInt(parts[1]) || 0;
        gold = parseInt(parts[2]) || 0;
        diamond = parseInt(parts[3]) || 0;
        coins = parseInt(parts[4]) || 0;
        tier = parseInt(parts[5]) || 1;
        render();
      }
    }
  }

  // Poll for sync every 2 seconds
  function requestSync() {
    try {
      PortalsSdk.sendMessageToUnity(JSON.stringify({
        TaskName: 'SyncHUD',
        TaskTargetState: 'SetNotActiveToActive'
      }));
    } catch(e) {}
  }

  // Set up message listener
  if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
    PortalsSdk.setMessageListener(function(message) {
      handleMessage(message);
    });
  } else {
    window.addEventListener('message', function(event) {
      if (event.data && typeof event.data === 'string') {
        handleMessage(event.data);
      }
    });
  }

  // Start polling
  setInterval(requestSync, 2000);

  // Initial render
  render();
})();
</script>
</body>
</html>
