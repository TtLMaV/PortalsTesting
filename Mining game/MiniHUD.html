<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      border: 2px solid #CD7F32;
      font-family: Arial, sans-serif;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon {
      font-size: 24px;
    }
    .count {
      color: #CD7F32;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span class="icon">🟠</span>
    <span class="count" id="copper">0</span>
  </div>
  
  <script>
    const STORAGE_KEY = 'portals_copper_count';

    function updateDisplay() {
      const saved = localStorage.getItem(STORAGE_KEY);
      const copper = parseInt(saved) || 0;
      document.getElementById('copper').textContent = copper;
    }

    // Update every 100ms to stay synced with listener
    setInterval(updateDisplay, 100);
    
    // Initial display
    updateDisplay();
    
    console.log('[MiniHUD] Ready and syncing');
  </script>
</body>
</html>
