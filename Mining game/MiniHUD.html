<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 10px;
      border: 2px solid #CD7F32;
      font-family: Arial, sans-serif;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon {
      font-size: 24px;
    }
    .count {
      color: #CD7F32;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span class="icon">🟠</span>
    <span class="count" id="copper">0</span>
  </div>
  
  <script>
    const STORAGE_KEY = 'portals_copper_count';
    let copper = 0;

    // Load saved copper
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      copper = parseInt(saved) || 0;
    }

    function updateDisplay() {
      document.getElementById('copper').textContent = copper;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, copper.toString());
    }

    function addCopper() {
      copper++;
      updateDisplay();
      save();
      console.log('Copper mined! Total:', copper);
    }

    // Listen for mine messages
    window.addEventListener('message', (event) => {
      const msg = event.data;
      console.log('Received message:', msg);
      
      // Any message with "mine" or "copper" in it = add copper
      if (typeof msg === 'string') {
        if (msg.includes('mine') || msg.includes('copper')) {
          addCopper();
        }
      }
    });

    // Initialize display
    updateDisplay();
    console.log('Mini HUD ready. Current copper:', copper);
  </script>
</body>
</html>
