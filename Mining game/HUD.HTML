<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mining HUD</title>

<script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

<style>
html, body {
    background: transparent !important;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}
.hud {
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 18px;
}
.value {
    font-weight: bold;
}
</style>
</head>
<body>

<div class="hud">
    ⛏ Ore: <span id="oreValue" class="value">0</span>
</div>

<script>
let ore = 0;

// Load from localStorage
function loadOre() {
    const saved = localStorage.getItem("ore");
    ore = saved ? parseInt(saved) : 0;
    updateDisplay();
}

// Save to localStorage
function saveOre() {
    localStorage.setItem("ore", ore);
}

// Update UI
function updateDisplay() {
    document.getElementById("oreValue").textContent = ore;
}

// Listen for Portals messages
PortalsSdk.setMessageListener(function(message) {

    let data = message;

    if (typeof message === "string") {
        try { data = JSON.parse(message); } catch (e) { return; }
    }

    if (data.type === "mined") {
        ore += Number(data.amount || 1);
        saveOre();
        updateDisplay();
    }
});

// Initialize
loadOre();
</script>

</body>
</html>
