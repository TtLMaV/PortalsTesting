<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
  <style>
    html, body { background: transparent !important; margin:0; padding:0; }
    #box { background: rgba(0,0,0,0.7); color:#fff; padding:10px 14px; border-radius:10px; font-family: Arial; }
  </style>
</head>
<body>
  <div id="box">⛏ Ore: <span id="ore">0</span></div>

  <script>
    PortalsSdk.setMessageListener(function(message) {
      // message might arrive as string or object
      let data = message;
      if (typeof message === "string") {
        try { data = JSON.parse(message); } catch (e) { return; }
      }

      if (data.type === "ore") {
        document.getElementById("ore").textContent = data.value;
      }
    });
  </script>
</body>
</html>
