<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mining HUD</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    .hud {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 18px;
      line-height: 1;
    }
    .label { opacity: 0.9; }
    .value { font-weight: 700; }
    .btn {
      margin-left: 10px;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="hud">
    <span class="label">⛏ Ore:</span>
    <span id="oreValue" class="value">0</span>
    <button id="resetBtn" class="btn" title="Reset local ore (testing)">Reset</button>
  </div>

  <script>
    const STORAGE_KEY = "portals_ore";
    let ore = 0;

    function loadOre() {
      const saved = localStorage.getItem(STORAGE_KEY);
      ore = saved ? parseInt(saved, 10) : 0;
      if (!Number.isFinite(ore)) ore = 0;
      render();
    }

    function saveOre() {
      localStorage.setItem(STORAGE_KEY, String(ore));
    }

    function render() {
      document.getElementById("oreValue").textContent = String(ore);
    }

    function addOre(amount) {
      const n = Number(amount);
      ore += Number.isFinite(n) ? n : 1;
      ore = Math.max(0, Math.floor(ore));
      saveOre();
      render();
    }

    // Reset button (for testing)
    document.getElementById("resetBtn").addEventListener("click", function() {
      ore = 0;
      saveOre();
      render();
    });

    // Receive messages from Portals
    PortalsSdk.setMessageListener(function(message) {
      let data = message;

      // Messages may arrive as a JSON string
      if (typeof message === "string") {
        try { data = JSON.parse(message); }
        catch (e) { return; }
      }

      // Expected: {"type":"mined","amount":1}
      if (data && data.type === "mined") {
        addOre(data.amount ?? 1);
      }

      // Optional: allow direct set (handy for debugging)
      // {"type":"setOre","value":10}
      if (data && data.type === "setOre") {
        const v = Number(data.value);
        ore = Number.isFinite(v) ? Math.max(0, Math.floor(v)) : ore;
        saveOre();
        render();
      }
    });

    // Init on load
    loadOre();
  </script>
</body>
</html>
