<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mining Inventory - Debug Mode</title>
  <style>
    body {
      font-family: monospace;
      background: #000;
      color: #0f0;
      padding: 20px;
    }
    .big {
      font-size: 24px;
      font-weight: bold;
      color: #0ff;
      margin: 20px 0;
    }
    .log {
      background: #111;
      padding: 10px;
      border: 1px solid #333;
      margin: 5px 0;
      font-size: 12px;
    }
    .error {
      color: #f00;
    }
    .success {
      color: #0f0;
    }
    .info {
      color: #ff0;
    }
  </style>
</head>
<body>
  <h1>🔍 Portals Message Debugger</h1>
  <div class="big">Copper: <span id="copper">0</span></div>
  <div class="big">Total: <span id="total">0</span></div>
  
  <hr>
  <h2>Message Log:</h2>
  <div id="log"></div>

  <script>
    const STORAGE_KEY = 'portals_mining_inventory';
    let inventory = { copper: 0, total: 0 };

    // Load saved data
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      inventory = JSON.parse(saved);
      log('✅ Loaded saved inventory: ' + JSON.stringify(inventory), 'success');
    } else {
      log('ℹ️ No saved data, starting fresh', 'info');
    }
    updateDisplay();

    function updateDisplay() {
      document.getElementById('copper').textContent = inventory.copper;
      document.getElementById('total').textContent = inventory.total;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
      log('💾 Saved to localStorage', 'success');
    }

    function addCopper() {
      inventory.copper++;
      inventory.total++;
      updateDisplay();
      save();
      log('⛏️ +1 Copper! New total: ' + inventory.copper, 'success');
    }

    function log(message, type = '') {
      const logDiv = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log ' + type;
      entry.innerHTML = `[${time}] ${message}`;
      logDiv.insertBefore(entry, logDiv.firstChild);
    }

    // CATCH EVERYTHING
    window.addEventListener('message', (event) => {
      log('📨 RAW EVENT RECEIVED:', 'info');
      log('   Origin: ' + event.origin, 'info');
      log('   Data type: ' + typeof event.data, 'info');
      log('   Data value: ' + JSON.stringify(event.data), 'info');
      
      const msg = event.data;

      // Try every possible format Portals might send

      // Format 1: Simple string "mine_copper"
      if (msg === 'mine_copper') {
        log('✅ Matched format: simple string "mine_copper"', 'success');
        addCopper();
        return;
      }

      // Format 2: String starting with "mine_"
      if (typeof msg === 'string' && msg.startsWith('mine_')) {
        log('✅ Matched format: string starting with "mine_"', 'success');
        addCopper();
        return;
      }

      // Format 3: Object with message property
      if (typeof msg === 'object' && msg.message) {
        log('✅ Found object with .message property: ' + msg.message, 'success');
        if (msg.message.includes('copper') || msg.message.includes('mine')) {
          addCopper();
          return;
        }
      }

      // Format 4: Object with data property
      if (typeof msg === 'object' && msg.data) {
        log('✅ Found object with .data property: ' + msg.data, 'success');
        if (msg.data.includes('copper') || msg.data.includes('mine')) {
          addCopper();
          return;
        }
      }

      // Format 5: Object with type and payload
      if (typeof msg === 'object' && msg.type) {
        log('✅ Found object with .type: ' + msg.type, 'success');
        if (msg.type.includes('copper') || msg.type.includes('mine')) {
          addCopper();
          return;
        }
      }

      // Format 6: Just any object mentioning copper or mine
      if (typeof msg === 'object') {
        const str = JSON.stringify(msg).toLowerCase();
        if (str.includes('copper') || str.includes('mine')) {
          log('✅ Found "copper" or "mine" in object', 'success');
          addCopper();
          return;
        }
      }

      log('❌ Message did not match any expected format', 'error');
    });

    log('🚀 Debugger initialized and listening...', 'success');
    log('ℹ️ Waiting for messages from Portals...', 'info');
  </script>
</body>
</html>
