<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navigation Bar</title>

<style>
:root{
  /* Bakelite plastic */
  --bak1:#2b211b;
  --bak2:#1f1814;
  --bak3:#140f0c;

  /* LCD */
  --lcdA:#bfefff;
  --lcdB:#5fa9c8;
  --lcdInk:#071821;
  --lcdGlow:rgba(120,235,255,.35);

  /* Built-in digital font stack */
  --digital: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}

body{
  background:transparent;
  margin:0;
  padding:0;
}

/* ================= NAVIGATION BAR ================= */
.navbar{
  width:100%;
  padding:12px 20px;
  background:
    radial-gradient(400px 80px at 50% 0%, rgba(255,245,230,.12), transparent 70%),
    linear-gradient(180deg, var(--bak1), var(--bak2));
  border-bottom:2px solid rgba(0,0,0,.8);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
}

/* Bakelite grain texture */
.navbar::after{
  content:"";
  position:absolute;inset:0;
  pointer-events:none;
  opacity:.18;
  background:
    radial-gradient(circle at 8px 8px, rgba(255,255,255,.08) 0.6px, transparent 1.2px) 0 0/18px 18px,
    radial-gradient(circle at 12px 14px, rgba(0,0,0,.25) 0.6px, transparent 1.2px) 0 0/22px 22px;
}

/* ================= NAV BUTTONS ================= */
.nav-button{
  padding:12px 32px;
  background:
    radial-gradient(180px 60px at 30% 0%, rgba(255,255,255,.55), transparent 60%),
    linear-gradient(180deg,var(--lcdA),var(--lcdB));
  border:1px solid rgba(0,0,0,.6);
  border-radius:12px;
  cursor:pointer;
  box-shadow:
    inset 0 -8px 16px rgba(0,0,0,.25),
    0 8px 16px rgba(0,0,0,.3);
  position:relative;
  overflow:hidden;
  transition:all .2s ease;
  font-family:var(--digital);
  font-size:18px;
  font-weight:800;
  letter-spacing:2px;
  color:var(--lcdInk);
  text-shadow:
    0 1px 0 rgba(255,255,255,.3),
    0 0 12px var(--lcdGlow);
  filter: contrast(1.15) saturate(1.1);
  text-align:center;
  text-transform:uppercase;
  z-index:2;
  min-width:140px;
}

.nav-button:hover{
  filter: contrast(1.2) saturate(1.2) brightness(1.05);
  transform:translateY(-2px);
  box-shadow:
    inset 0 -8px 16px rgba(0,0,0,.25),
    0 12px 20px rgba(0,0,0,.35);
}

.nav-button:active{
  filter: contrast(1.1) saturate(1.05) brightness(.98);
  transform:translateY(0);
  box-shadow:
    inset 0 -8px 16px rgba(0,0,0,.25),
    0 4px 8px rgba(0,0,0,.25);
}

/* LCD scanlines */
.nav-button::after{
  content:"";
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    180deg,
    rgba(0,0,0,.12) 0px,
    rgba(0,0,0,.12) 1px,
    transparent 2px,
    transparent 4px
  );
  opacity:.25;
  pointer-events:none;
}

.nav-button-text{
  position:relative;
  z-index:2;
}

/* Keyboard shortcut badge */
.shortcut{
  display:inline-block;
  margin-right:8px;
  padding:2px 6px;
  background:rgba(7,24,33,.2);
  border-radius:4px;
  font-size:14px;
  opacity:.8;
}
</style>
</head>

<body>
<nav class="navbar" role="navigation" aria-label="Main navigation">
  <button class="nav-button" id="tutorialBtn">
    <span class="nav-button-text"><span class="shortcut">1</span>Tutorial</span>
  </button>
  <button class="nav-button" id="lobbyBtn">
    <span class="nav-button-text"><span class="shortcut">2</span>Lobby</span>
  </button>
</nav>

<script>
function send(payload){ window.parent?.postMessage(payload,"*"); }

document.getElementById("tutorialBtn").onclick = () => {
  send({type:"OPEN_TUTORIAL"});
};

document.getElementById("lobbyBtn").onclick = () => {
  send({type:"RETURN_TO_LOBBY"});
};

/* Keyboard shortcuts */
window.addEventListener("keydown", (e) => {
  if(e.key === "1") document.getElementById("tutorialBtn").click();
  if(e.key === "2") document.getElementById("lobbyBtn").click();
});
</script>
</body>
</html>
