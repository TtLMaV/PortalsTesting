<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fishing — Shrimp</title>

<style>
:root{
  --stone:#3b3024;
  --stone2:#2a221a;
  --gold:#c8a04a;
  --line:#5a4a35;
  --txt:#f4e7c2;
  --muted:#b7a88a;
  --water1:#1b7fb5;
  --water2:#0f5f8d;
}

html,body{
  margin:0;
  height:100%;
  font-family:system-ui;
  background:transparent;
  color:var(--txt);
  user-select:none;
}

.wrap{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.panel{
  width:500px;
  height:380px;
  border-radius:14px;
  background:linear-gradient(180deg,var(--stone),var(--stone2));
  border:2px solid var(--line);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  overflow:hidden;
  position:relative;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:rgba(200,160,74,0.1);
  font-size:13px;
  font-weight:700;
  letter-spacing:0.5px;
  text-transform:uppercase;
}

.close{
  cursor:pointer;
  color:#ffcccc;
}

.content{
  position:absolute;
  inset:60px 0 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.lake{
  width:260px;
  height:170px;
  border-radius:14px;
  border:1px solid var(--gold);
  background:linear-gradient(180deg,var(--water1),var(--water2));
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.lake span{
  font-size:42px;
}

.meter{
  width:320px;
  height:14px;
  border-radius:999px;
  border:1px solid var(--gold);
  background:rgba(0,0,0,0.4);
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#a6e7ff,#1b7fb5);
  transition:width 0.1s ease;
}

.big{
  font-size:18px;
  font-weight:800;
}

.sub{
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="wrap">
  <div class="panel">
    <div class="topbar">
      <div>🕸️ Net Fishing</div>
      <div class="close" id="closeBtn">✕</div>
    </div>

    <div class="content">
      <div class="lake" id="lake">
        <span>🦐</span>
      </div>

      <div class="big" id="bigText">Click rapidly to pull the net!</div>
      <div class="sub">Fill the bar to catch shrimp.</div>

      <div class="meter">
        <div class="fill" id="fill"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================
   CONFIG
   ========================= */
var TOTAL_CLICKS = 14;
var TASK_NAME = 'Fish_Shrimp_Complete';

/* =========================
   Portals Helpers
   ========================= */
function triggerTask(name){
  if (typeof PortalsSdk !== 'undefined' && PortalsSdk.sendMessageToUnity){
    PortalsSdk.sendMessageToUnity(JSON.stringify({
      TaskName:name,
      TaskTargetState:'SetNotActiveToActive'
    }));
  }
}

function closeIframe(){
  if (typeof PortalsSdk !== 'undefined' && PortalsSdk.closeIframe){
    PortalsSdk.closeIframe();
  }
}

/* =========================
   Game Logic
   ========================= */
var lake = document.getElementById('lake');
var fill = document.getElementById('fill');
var bigText = document.getElementById('bigText');
var closeBtn = document.getElementById('closeBtn');

var clicks = 0;
var finished = false;

lake.addEventListener('click', function(){
  if (finished) return;

  clicks++;
  var percent = Math.min(100, (clicks / TOTAL_CLICKS) * 100);
  fill.style.width = percent + '%';

  if (clicks >= TOTAL_CLICKS){
    finished = true;
    bigText.textContent = 'Success! You caught shrimp.';
    triggerTask(TASK_NAME);

    setTimeout(function(){
      closeIframe();
    },1200);
  }
});

closeBtn.addEventListener('click', closeIframe);
</script>

</body>
</html>

</body>
</html>
